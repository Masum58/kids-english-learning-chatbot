services:
  - type: web
    name: teddy-english-chatbot
    env: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: teddy-postgres
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_TIMEOUT_SECONDS
        value: "1.5"

databases:
  - name: teddy-postgres
    plan: free
    region: oregon
